<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src
          'self'
          'sha256-6DsmMKohzOafv4MRwMTLb2ckEdTY6oKxmM1UF07/0lY=';
        style-src
          'self'
          'unsafe-inline'
          https://fonts.googleapis.com;
        img-src
          'self'
          https://images.weserv.nl
          data:;
        connect-src
          https://rss.app;
        font-src
          'self'
          https://fonts.gstatic.com;
        object-src 'none';
        frame-src 'none';
        base-uri 'self';
      ">
    <title>Noticias Mundo</title>

    <style>
        @font-face {
            font-family: 'BlissLight';
            src: url('font/BlissLight Regular.ttf') format('truetype');
        }

        @font-face {
            font-family: 'BlissHeavy';
            src: url('font/blisspro_heavy.otf') format('opentype');
            font-weight: 700;
        }

        :root {
            --title-color: #373359;
            --summary-color: #2d295b;
            --line-color: #373359;
            --radius: 18px;
            --side-padding: 5%;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'BlissLight', Arial, sans-serif;
        }

        /* CONTENEDOR GENERAL */
        .card-widget {
            width: 100%;
            height: 100%;
            padding: 1.5%;
            box-sizing: border-box;
        }

        .card-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .card-header h1 {
            margin: 0;
            text-align: center;
            font-family: 'BlissHeavy', Arial, sans-serif;
            font-size: clamp(20px, 3vw, 32px);
            color: var(--title-color);
        }

        .header-line {
            border: none;
            height: 2px;
            background-color: var(--line-color);
            width: 70%;
            margin: 8px auto 12px auto;
        }

        /* CARRUSEL */
        .news-carousel-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .card-body {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            padding: 0 var(--side-padding);
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none;
        }

        .card-body.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* FILA DE CONTENIDO */
        .news-row {
            display: flex;
            align-items: center;
            gap: 3%;
            width: 100%;
        }

        /* IMAGEN */
        .image-container {
            width: 22%;
            max-width: 200px;
            aspect-ratio: 1 / 1;
            border-radius: var(--radius);
            overflow: hidden;
            flex-shrink: 0;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* TEXTO */
        .text-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.6vh;
        }

        .news-title {
            font-family: 'BlissHeavy', Arial, sans-serif;
            color: var(--title-color);
            font-size: clamp(18px, 2.4vw, 28px);
            line-height: 1.2;
        }

        .summary {
            color: var(--summary-color);
            font-size: clamp(14px, 1.4vw, 20px);
            line-height: 1.35;
        }

        /* PAGINACIÓN */
        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 6px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #ccc;
            margin: 0 4px;
        }

        .dot.active {
            background-color: var(--line-color);
        }

        /* ALTURA MUY BAJA */
        @media (max-height: 300px) {
            .news-title {
                font-size: 16px;
            }

            .summary {
                font-size: 13px;
            }

            .image-container {
                width: 18%;
            }
        }
    </style>
</head>

<body>

<div class="card-widget">
    <div class="card-content">

        <div class="card-header">
            <h1>Noticias Mundo</h1>
            <hr class="header-line">
        </div>

        <div id="news-carousel-container" class="news-carousel-container"></div>
        <div id="pagination" class="pagination"></div>

    </div>
</div>

<script>
    const API_URL = "https://rss.app/feeds/v1.1/oZiRf4qVg2rtunGW.json";
    const INTERVAL_MS = 15000;

    let newsItems = [];
    let currentNewsIndex = 0;
    let carouselInterval;

    const carouselContainer = document.getElementById("news-carousel-container");
    const paginationContainer = document.getElementById("pagination");

    async function fetchNews() {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            newsItems = data.items || [];

            if (newsItems.length) {
                renderCarousel();
                startCarousel();
            }
        } catch {
            carouselContainer.innerHTML = "<p>Error al cargar noticias</p>";
        }
    }

    function renderCarousel() {
        carouselContainer.innerHTML = "";
        paginationContainer.innerHTML = "";

        newsItems.forEach((item, index) => {
            carouselContainer.appendChild(createNewsCard(item, index));
            paginationContainer.appendChild(createDot(index));
        });

        updateDisplay(0);
    }

    function createNewsCard(item, index) {
        const card = document.createElement("div");
        card.className = "card-body";
        card.dataset.index = index;

        card.innerHTML = `
            <div class="news-row">
                <div class="image-container">
                    <img src="${item.image || 'placeholder.png'}" alt="">
                </div>
                <div class="text-content">
                    <div class="news-title">${item.title}</div>
                    <div class="summary">
                        ${item.content_text || item.title}
                    </div>
                </div>
            </div>
        `;
        return card;
    }

    function createDot(index) {
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.onclick = () => {
            clearInterval(carouselInterval);
            updateDisplay(index);
            startCarousel();
        };
        return dot;
    }

    function updateDisplay(index) {
        currentNewsIndex = index;
        document.querySelectorAll(".card-body").forEach((c, i) =>
            c.classList.toggle("active", i === index)
        );
        document.querySelectorAll(".dot").forEach((d, i) =>
            d.classList.toggle("active", i === index)
        );
    }

    function startCarousel() {
        clearInterval(carouselInterval);
        carouselInterval = setInterval(() => {
            updateDisplay((currentNewsIndex + 1) % newsItems.length);
        }, INTERVAL_MS);
    }

    document.addEventListener("DOMContentLoaded", fetchNews);
</script>

</body>
</html>
